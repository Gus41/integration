services:
  sales:
    build: ./sales-system
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  inventory:
    build: ./inventory-system
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  integration:
    build: ./integration-service
    ports:
      - "8001:8001"
    depends_on:
      - inventory
      - sales

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data: