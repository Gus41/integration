{% extends "base.html" %}

{% block content %}


<h2>{{ title }}</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <div style="display:flex;gap:8px;align-items:center">
        <button class="btn" type="submit">Salvar</button>
        <a class="btn btn-secondary" href="{% url 'item_list' %}">Cancelar</a>
    </div>

</form>

{% endblock %}
