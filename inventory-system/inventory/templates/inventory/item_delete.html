{% extends "base.html" %}

{% block content %}


<h2>Excluir item</h2>

<p>Excluir "{{ item.name }}"?</p>

<form method="post">
    {% csrf_token %}

    <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-danger" type="submit">Confirmar</button>
        <a class="btn btn-secondary" href="{% url 'item_list' %}">Cancelar</a>
    </div>

</form>

{% endblock %}
